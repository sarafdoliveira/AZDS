<style>
  .az-ba-slider, .az-ba-slider * { box-sizing: border-box; }
  .az-ba-slider {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    padding: 48px 24px 80px;
    background: #fafafa;
  }
  .az-ba-slider .ba-wrap { max-width: 960px; width: 100%; }
  .az-ba-slider .ba-label-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #8a8a8a;
    margin: 0 0 10px;
    padding: 0 2px;
  }
  .az-ba-slider .ba-label-row .ba-after { color: #9b1b5e; }
  .az-ba-slider .ba-compare {
    position: relative;
    width: 100%;
    aspect-ratio: 1600 / 1137;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 12px 32px rgba(0,0,0,0.12);
    user-select: none;
    cursor: ew-resize;
    background: #fff;
  }
  .az-ba-slider .ba-compare img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    pointer-events: none;
  }
  .az-ba-slider .ba-img-after { z-index: 1; }
  .az-ba-slider .ba-img-before {
    z-index: 2;
    clip-path: inset(0 50% 0 0);
  }
  .az-ba-slider .ba-handle {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 0;
    z-index: 3;
    pointer-events: none;
  }
  .az-ba-slider .ba-handle::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -1px;
    width: 2px;
    background: #ffffff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.12);
  }
  .az-ba-slider .ba-handle .ba-knob {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15), 0 4px 12px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .az-ba-slider .ba-knob svg { width: 14px; height: 14px; }
  .az-ba-slider .ba-hint {
    text-align: center;
    font-size: 13px;
    color: #9a9a9a;
    margin-top: 14px;
  }
</style>

  <script>
    (function () {
      const compare = document.getElementById("baCompare");
      const imgBefore = document.getElementById("baImgBefore");
      const handle = document.getElementById("baHandle");
      let dragging = false;

      function setPosition(clientX) {
        const rect = compare.getBoundingClientRect();
        let pct = ((clientX - rect.left) / rect.width) * 100;
        pct = Math.max(0, Math.min(100, pct));
        imgBefore.style.clipPath = "inset(0 " + (100 - pct) + "% 0 0)";
        handle.style.left = pct + "%";
      }

      function start(e) {
        dragging = true;
        move(e);
      }
      function move(e) {
        if (!dragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        setPosition(clientX);
      }
      function end() { dragging = false; }

      compare.addEventListener("mousedown", start);
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", end);
      compare.addEventListener("touchstart", start, { passive: true });
      window.addEventListener("touchmove", move, { passive: true });
      window.addEventListener("touchend", end);
    })();
  </script>
