<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before / after slider</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #fafafa;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }
  .wrap { max-width: 960px; width: 100%; }
  .label-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #8a8a8a;
    margin: 0 0 10px;
    padding: 0 2px;
  }
  .label-row .after { color: #9b1b5e; }
  .compare {
    position: relative;
    width: 100%;
    aspect-ratio: 1600 / 1137;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 12px 32px rgba(0,0,0,0.12);
    user-select: none;
    cursor: ew-resize;
    background: #fff;
  }
  .compare img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    pointer-events: none;
  }
  .img-after { z-index: 1; }
  .img-before {
    z-index: 2;
    clip-path: inset(0 50% 0 0);
  }
  .handle {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 0;
    z-index: 3;
    pointer-events: none;
  }
  .handle::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -1px;
    width: 2px;
    background: #ffffff;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.12);
  }
  .handle .knob {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 1px 2px rgba(0,0,0,0.15), 0 4px 12px rgba(0,0,0,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .knob svg { width: 14px; height: 14px; }
  .hint {
    text-align: center;
    font-size: 13px;
    color: #9a9a9a;
    margin-top: 14px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label-row">
      <span class="before">Before</span>
      <span class="after">After</span>
    </div>
    <div class="compare" id="compare">
      <img class="img-after" src="after.png" alt="After">
      <img class="img-before" id="imgBefore" src="before.png" alt="Before">
      <div class="handle" id="handle">
        <div class="knob">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 3 12 9 18"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 21 12 15 18"/></svg>
        </div>
      </div>
    </div>
    <p class="hint">Drag the handle to compare</p>
  </div>

  <script>
    const compare = document.getElementById("compare");
    const imgBefore = document.getElementById("imgBefore");
    const handle = document.getElementById("handle");
    let dragging = false;

    function setPosition(clientX) {
      const rect = compare.getBoundingClientRect();
      let pct = ((clientX - rect.left) / rect.width) * 100;
      pct = Math.max(0, Math.min(100, pct));
      imgBefore.style.clipPath = "inset(0 " + (100 - pct) + "% 0 0)";
      handle.style.left = pct + "%";
    }

    function start(e) {
      dragging = true;
      move(e);
    }
    function move(e) {
      if (!dragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      setPosition(clientX);
    }
    function end() { dragging = false; }

    compare.addEventListener("mousedown", start);
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", end);
    compare.addEventListener("touchstart", start, { passive: true });
    window.addEventListener("touchmove", move, { passive: true });
    window.addEventListener("touchend", end);
  </script>
</body>
</html>
